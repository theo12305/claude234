name: Check data sources

# Tests every state service and portal link of the app (tools/check_sources.py). Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu > /dev/null
      - run: python tools/probe_boreholes.py
      - run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add -f tools/recorded.pkl.gz && git commit -m "Recorded service answers (temporary)" && git push
      - uses: actions/upload-artifact@v4
        with:
          name: probe-files
          path: probe_files
      - run: cat source_status.md >> "$GITHUB_STEP_SUMMARY"
        if: hashFiles('source_status.md') != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-status
          path: source_status.*
